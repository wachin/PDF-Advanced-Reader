[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfar"
version = "0.1.0"
description = "Lector de PDF avanzado con búsqueda por página"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Washington Indacochea Delgado", email = "linuxfrontier@proton.me"}
]
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.4.0",
    "PyMuPDF>=1.22.0",
]

[project.scripts]
pdfar = "pdfar.main:main"

[tool.setuptools.packages.find]
where = ["src"]
