<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#dbe3f0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1398" height="858" rx="28" fill="url(#bg)" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="20" y="20" width="1360" height="820" rx="20" fill="url(#grid)" opacity="0.55"/>

  <text x="70" y="88" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700"
        fill="#1e293b">Document loading and tiled rendering</text>
  <text x="70" y="126" font-family="DejaVu Sans, sans-serif" font-size="19"
        fill="#64748b">How PDFAR turns a PDF file into smooth, on-demand page tiles</text>

  <!-- Top pipeline -->
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="70" y="240" width="210" height="140" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="175" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">PDF file</text>
    <text x="175" y="322" text-anchor="middle" font-size="15" fill="#64748b">pages, fonts, images</text>
    <path d="M150 340 h50 v16 h-50 z" fill="#e2e8f0"/>
    <path d="M160 332 h30 v8 h-30 z" fill="#cbd5e1"/>
    <path d="M160 356 h30 v6 h-30 z" fill="#cbd5e1"/>

    <rect x="330" y="240" width="210" height="140" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="435" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">PyMuPDF</text>
    <text x="435" y="322" text-anchor="middle" font-size="15" fill="#4f46e5">document model</text>
    <circle cx="435" cy="352" r="13" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path d="M435 345 v10 M431 351 l4 5 l4 -5" stroke="#6366f1" stroke-width="2" fill="none"/>

    <rect x="590" y="240" width="210" height="140" rx="18" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="695" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">Layout engine</text>
    <text x="695" y="322" text-anchor="middle" font-size="15" fill="#0284c7">continuous scroll</text>
    <path d="M665 344 h60 M665 352 h60 M665 360 h36" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>

    <rect x="850" y="240" width="210" height="140" rx="18" fill="url(#accent)" stroke="#be123c" stroke-width="2"/>
    <text x="955" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Render pool</text>
    <text x="955" y="322" text-anchor="middle" font-size="15" fill="#ffe4e6">background threads</text>
    <path d="M925 342 a15 15 0 1 1 6 12" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M924 336 l4 8 l-9 1" fill="#ffffff"/>

    <rect x="1110" y="240" width="210" height="140" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1215" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Screen</text>
    <text x="1215" y="322" text-anchor="middle" font-size="15" fill="#16a34a">QPainter paint</text>
    <rect x="1180" y="336" width="70" height="30" rx="4" fill="#dcfce7" stroke="#22c55e"/>
    <path d="M1192 350 h10 M1210 350 h10 M1228 350 h10" stroke="#22c55e" stroke-width="3"/>
  </g>

  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="284" y1="310" x2="322" y2="310"/>
    <line x1="544" y1="310" x2="582" y2="310"/>
    <line x1="804" y1="310" x2="842" y2="310"/>
    <line x1="1064" y1="310" x2="1102" y2="310"/>
  </g>

  <!-- Cache row -->
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="330" y="500" width="300" height="150" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="480" y="550" text-anchor="middle" font-size="19" font-weight="700" fill="#92400e">Tile cache (LRU)</text>
    <text x="480" y="580" text-anchor="middle" font-size="15" fill="#b45309">visible pages first</text>
    <g fill="#fef3c7" stroke="#f59e0b">
      <rect x="372" y="596" width="48" height="34" rx="4"/>
      <rect x="428" y="596" width="48" height="34" rx="4"/>
      <rect x="484" y="596" width="48" height="34" rx="4"/>
      <rect x="540" y="596" width="48" height="34" rx="4"/>
    </g>
    <text x="396" y="618" text-anchor="middle" font-size="12" fill="#92400e">1</text>
    <text x="452" y="618" text-anchor="middle" font-size="12" fill="#92400e">2</text>
    <text x="508" y="618" text-anchor="middle" font-size="12" fill="#92400e">3</text>
    <text x="564" y="618" text-anchor="middle" font-size="12" fill="#92400e">4</text>

    <rect x="700" y="500" width="300" height="150" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="850" y="550" text-anchor="middle" font-size="19" font-weight="700" fill="#5b21b6">Priority queue</text>
    <text x="850" y="580" text-anchor="middle" font-size="15" fill="#7c3aed">visible &gt; prefetch</text>
    <g>
      <rect x="748" y="598" width="120" height="14" rx="7" fill="#ede9fe"/>
      <rect x="748" y="598" width="86" height="14" rx="7" fill="#8b5cf6"/>
      <rect x="748" y="620" width="120" height="14" rx="7" fill="#ede9fe"/>
      <rect x="748" y="620" width="44" height="14" rx="7" fill="#a78bfa"/>
    </g>

    <rect x="1070" y="500" width="250" height="150" rx="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="1195" y="550" text-anchor="middle" font-size="19" font-weight="700" fill="#075985">Thumbnails</text>
    <text x="1195" y="580" text-anchor="middle" font-size="15" fill="#0284c7">background strip</text>
    <g fill="#e0f2fe" stroke="#0ea5e9">
      <rect x="1110" y="594" width="38" height="50" rx="3"/>
      <rect x="1156" y="594" width="38" height="50" rx="3"/>
      <rect x="1202" y="594" width="38" height="50" rx="3"/>
      <rect x="1248" y="594" width="38" height="50" rx="3"/>
    </g>
  </g>

  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <path d="M955 384 V450 H480 V496" marker-end="url(#arrow)"/>
    <path d="M955 384 V450 H1195 V496" marker-end="url(#arrow)"/>
    <path d="M955 470 V500" marker-end="url(#arrow)"/>
  </g>

  <text x="70" y="760" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#64748b">
    Visible pages are rendered first; cached tiles survive zoom and rotation until the memory budget is exceeded.
  </text>
  <g font-family="DejaVu Sans, sans-serif" font-size="13" fill="#64748b">
    <rect x="70" y="786" width="16" height="16" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="96" y="799">Document model</text>
    <rect x="240" y="786" width="16" height="16" rx="4" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="266" y="799">Layout</text>
    <rect x="350" y="786" width="16" height="16" rx="4" fill="#fb7185"/>
    <text x="376" y="799">Render work</text>
    <rect x="490" y="786" width="16" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="516" y="799">Cache</text>
  </g>
</svg>
