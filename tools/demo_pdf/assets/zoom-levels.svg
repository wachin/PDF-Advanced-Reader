<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="758" rx="26" fill="url(#bg)" stroke="#c7d2fe" stroke-width="2"/>
  <text x="60" y="64" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700"
        fill="#1e293b">Additive zoom levels</text>
  <text x="60" y="96" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#64748b">
    Every step adds a fixed percentage of the page size, so the scale stays predictable.
  </text>

  <g filter="url(#shadow)">
    <rect x="80" y="390" width="150" height="212" rx="8" fill="url(#page)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="96" y="410" width="118" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="96" y="432" width="90" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="96" y="448" width="104" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="96" y="464" width="74" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="96" y="490" width="118" height="70" rx="5" fill="#e0f2fe"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="300" width="260" height="368" rx="10" fill="url(#page)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="326" y="330" width="208" height="18" rx="9" fill="#94a3b8"/>
    <rect x="326" y="366" width="160" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="326" y="386" width="190" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="326" y="406" width="140" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="326" y="444" width="208" height="120" rx="7" fill="#eef2ff"/>
    <circle cx="430" cy="504" r="38" fill="#c7d2fe"/>
    <rect x="326" y="586" width="180" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="326" y="606" width="200" height="9" rx="4.5" fill="#e2e8f0"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="220" width="380" height="448" rx="12" fill="url(#page)" stroke="#64748b" stroke-width="2"/>
    <rect x="654" y="254" width="300" height="26" rx="13" fill="#64748b"/>
    <rect x="654" y="304" width="228" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="654" y="328" width="290" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="654" y="352" width="184" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="654" y="392" width="300" height="150" rx="10" fill="#e0f2fe"/>
    <circle cx="804" cy="467" r="50" fill="#7dd3fc"/>
    <path d="M706 580 h180" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
    <rect x="654" y="606" width="250" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="654" y="630" width="200" height="12" rx="6" fill="#e2e8f0"/>
  </g>

  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">
    <text x="155" y="704">50%</text>
    <text x="430" y="704">100%</text>
    <text x="810" y="704">200%</text>
  </g>

  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="165" y1="676" x2="430" y2="676"/>
    <line x1="440" y1="676" x2="800" y2="676"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="297" y="668">×2</text>
    <text x="620" y="668">×2</text>
  </g>

  <g font-family="DejaVu Sans, sans-serif" font-size="14" fill="#475569">
    <text x="1030" y="250" font-size="16" font-weight="700" fill="#334155">Zoom step</text>
    <text x="1030" y="278">10% by default</text>
    <text x="1030" y="302">50 → 400% presets</text>
    <text x="1030" y="344" font-size="16" font-weight="700" fill="#334155">Ctrl + wheel</text>
    <text x="1030" y="372">follows the step</text>
    <text x="1030" y="396">when enabled</text>
    <rect x="1030" y="424" width="130" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="1030" y="424" width="52" height="10" rx="5" fill="#3b82f6"/>
    <text x="1030" y="456" font-size="12" fill="#64748b">current zoom 120%</text>
    <text x="1030" y="498" font-size="16" font-weight="700" fill="#334155">Anchoring</text>
    <text x="1030" y="526">keeps the cursor</text>
    <text x="1030" y="550">position stable</text>
  </g>
</svg>
